<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    <main class="container">
      <section class="status-card">
        <p class="eyebrow">FastAPI skeleton</p>
        <h1>AI Chatbot 프로젝트</h1>
        <p>스켈레톤이 정상적으로 실행 중입니다.</p>
        <p>환경: {{ app_env }} · <a href="/health">health 확인</a></p>
        {% if is_authenticated %}
          <p>로그인 상태입니다.</p>
          <nav class="auth-actions" aria-label="챗봇 메뉴">
            <a class="button" href="/chat">챗봇으로 이동</a>
          </nav>
          <form class="auth-actions" method="post" action="/auth/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">로그아웃</button>
          </form>
        {% else %}
          <nav class="auth-actions" aria-label="인증 메뉴">
            <a class="button secondary" href="/auth/signup">회원가입</a>
            <a class="button" href="/auth/login">로그인</a>
          </nav>
        {% endif %}
      </section>
    </main>
  </body>
</html>
