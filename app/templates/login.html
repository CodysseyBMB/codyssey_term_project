<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 · AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    <main class="container">
      <section class="status-card">
        <p class="eyebrow">로그인</p>
        <h1>다시 만나서 반가워요</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/auth/login">
          <label>아이디
            <input type="text" name="username" value="{{ username }}" required minlength="3" maxlength="20" autocomplete="username">
          </label>
          <label>비밀번호
            <input type="password" name="password" required minlength="8" maxlength="100" autocomplete="current-password">
          </label>
          <button type="submit">로그인</button>
        </form>
        <p class="auth-guide">계정이 없나요? <a href="/auth/signup">회원가입</a></p>
      </section>
    </main>
  </body>
</html>
